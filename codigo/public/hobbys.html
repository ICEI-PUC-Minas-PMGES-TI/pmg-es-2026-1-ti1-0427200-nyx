<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Preferências do Usuário</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>Escolha suas Preferências</h1>

        <form id="preferencesForm">

            <!-- Jogos -->
            <section class="card">
                <h2>🎮 Jogos</h2>

                <div class="options">
                    <label><input type="checkbox" name="jogos" value="Minecraft"> Minecraft</label>
                    <label><input type="checkbox" name="jogos" value="Valorant"> Valorant</label>
                    <label><input type="checkbox" name="jogos" value="CS2"> CS2</label>
                    <label><input type="checkbox" name="jogos" value="League of Legends"> League of Legends</label>
                    <label><input type="checkbox" name="jogos" value="Fortnite"> Fortnite</label>
                    <label><input type="checkbox" name="jogos" value="GTA V"> GTA V</label>
                    <label><input type="checkbox" name="jogos" value="FIFA"> FIFA</label>
                    <label><input type="checkbox" name="jogos" value="The Sims"> The Sims</label>
                </div>
            </section>

            <!-- Música -->
            <section class="card">
                <h2>🎵 Tipos Musicais</h2>

                <div class="options">
                    <label><input type="checkbox" name="musicas" value="Rock"> Rock</label>
                    <label><input type="checkbox" name="musicas" value="Pop"> Pop</label>
                    <label><input type="checkbox" name="musicas" value="Rap"> Rap</label>
                    <label><input type="checkbox" name="musicas" value="Funk"> Funk</label>
                    <label><input type="checkbox" name="musicas" value="Eletrônica"> Eletrônica</label>
                    <label><input type="checkbox" name="musicas" value="Sertanejo"> Sertanejo</label>
                    <label><input type="checkbox" name="musicas" value="K-pop"> K-pop</label>
                    <label><input type="checkbox" name="musicas" value="MPB"> MPB</label>
                </div>
            </section>

            <!-- Hobbies -->
            <section class="card">
                <h2>🧩 Hobbies</h2>

                <div class="options">
                    <label><input type="checkbox" name="hobbies" value="Ler"> Ler</label>
                    <label><input type="checkbox" name="hobbies" value="Desenhar"> Desenhar</label>
                    <label><input type="checkbox" name="hobbies" value="Academia"> Academia</label>
                    <label><input type="checkbox" name="hobbies" value="Programar"> Programar</label>
                    <label><input type="checkbox" name="hobbies" value="Cozinhar"> Cozinhar</label>
                    <label><input type="checkbox" name="hobbies" value="Fotografia"> Fotografia</label>
                    <label><input type="checkbox" name="hobbies" value="Viajar"> Viajar</label>
                    <label><input type="checkbox" name="hobbies" value="Assistir séries"> Assistir séries</label>
                </div>
            </section>

            <button type="submit">Salvar Preferências</button>

        </form>

        
    </div>

    <script src="script.js"></script>
</body>
</html>
