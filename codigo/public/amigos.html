<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Amigos</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div id="menu-overlay" class="menu-overlay"></div>

  <!-- barra lateral -->
  <div id="global-menu" class="global-menu">
    <button id="close-menu" class="close-btn">&times;</button>
    <div class="menu-user">
      <img id="menu-avatar" src="" alt="Avatar" class="menu-avatar-img">
      <span id="menu-username" class="menu-username"></span>
      <span id="menu-bio" class="menu-bio"></span>
    </div>
    <nav class="menu-options">
      <a href="#" class="menu-link active">Chat</a>
      <a href="#" class="menu-link">Menu Inicial</a>
      <a href="#" class="menu-link">Fórum</a>
    </nav>
    <footer class="menu-footer">
      <button id="btn-denuncias" class="btn-denuncias">Denuncias</button>
    </footer>
  </div>

  <div id="app">

    <header id="topbar">
      <button id="open-menu" class="hamburger" aria-label="Abrir menu">
        <span></span><span></span><span></span>
      </button>
      <div id="current-user-info" class="topbar-user">
        <img id="topbar-avatar" src="" alt="Avatar" class="topbar-avatar">
        <span id="topbar-username" class="topbar-username"></span>
        <span class="status-dot online"></span>
      </div>
    </header>

    <div id="content-wrapper">

      <!-- painel de amigos -->
      <aside id="friends-panel">
        <div class="panel-header">
          <h2 class="panel-title">Amigos</h2>
          <button id="btn-add-friend" class="btn-add">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
              <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/>
              <circle cx="9" cy="7" r="4"/>
              <line x1="19" y1="8" x2="19" y2="14"/>
              <line x1="22" y1="11" x2="16" y2="11"/>
            </svg>
            Adicionar amigo
          </button>
        </div>
        <div class="search-wrap">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
          </svg>
          <input type="text" id="search-input" class="search-input" placeholder="buscar amigo...">
        </div>
        <div id="friends-grid" class="friends-grid-wrap">
          <!-- populado pelo JS -->
        </div>
      </aside>

      <!-- feed  -->
      <main id="feed">
        <h2 class="feed-title">Posts dos seus amigos</h2>
        <div id="posts-list" class="posts-list">
          <!-- populado pelo JS -->
        </div>
      </main>

    </div>
  </div>

  <script src="script.js"></script>
</body>

</html>
