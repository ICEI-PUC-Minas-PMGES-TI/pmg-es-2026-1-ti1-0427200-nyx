<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Início</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="home_style.css">
</head>
<body>

  <div class="bg-glow" aria-hidden="true"></div>

  <main class="auth-wrapper">
    <div class="home-card">

      <div class="auth-logo">
        <svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <circle cx="24" cy="24" r="24" fill="url(#gh)"/>
          <path d="M24 12a7 7 0 1 1 0 14 7 7 0 0 1 0-14zm-11 22c0-5 4.9-9 11-9s11 4 11 9" stroke="#fff" stroke-width="2.5" stroke-linecap="round"/>
          <defs>
            <radialGradient id="gh" cx="50%" cy="40%" r="60%">
              <stop offset="0%" stop-color="#9b7ee0"/>
              <stop offset="100%" stop-color="#3b1f7a"/>
            </radialGradient>
          </defs>
        </svg>
        <span class="auth-logo-text">Nyx</span>
      </div>

      <img id="home-avatar" class="home-avatar" src="" alt="Avatar do usuário">
      <p id="home-username" class="home-username"></p>
      <p id="home-bio" class="home-bio"></p>
      <span class="home-badge">✓ Sessão ativa</span>
      <button type="button" id="btn-logout" class="btn-logout">Sair da conta</button>

    </div>
  </main>

  <script src="home_script.js"></script>
</body>
</html>
