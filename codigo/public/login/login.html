<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="login_style.css">
</head>
<body>

  <div class="bg-glow" aria-hidden="true"></div>

  <main class="auth-wrapper">
    <div class="auth-card">

      <div class="auth-logo">
        <svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <circle cx="24" cy="24" r="24" fill="url(#g1)"/>
          <path d="M24 12a7 7 0 1 1 0 14 7 7 0 0 1 0-14zm-11 22c0-5 4.9-9 11-9s11 4 11 9" stroke="#fff" stroke-width="2.5" stroke-linecap="round"/>
          <defs>
            <radialGradient id="g1" cx="50%" cy="40%" r="60%">
              <stop offset="0%" stop-color="#9b7ee0"/>
              <stop offset="100%" stop-color="#3b1f7a"/>
            </radialGradient>
          </defs>
        </svg>
        <span class="auth-logo-text">Nyx</span>
      </div>

      <h1 class="auth-title">Bem-vinda de volta</h1>
      <p class="auth-subtitle">Entre com sua conta para continuar</p>

      <p id="feedback" class="feedback" role="alert" aria-live="polite"></p>

      <div class="auth-form" id="login-form">
        <div class="field">
          <label for="username" class="field-label">Usuário</label>
          <input type="text" id="username" class="field-input" placeholder="seu_username" autocomplete="username">
        </div>
        <div class="field">
          <label for="password" class="field-label">Senha</label>
          <div class="password-wrap">
            <input type="password" id="password" class="field-input" placeholder="••••••••" autocomplete="current-password">
            <button type="button" class="toggle-password" aria-label="Mostrar senha" data-target="password">
              <svg class="eye-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>
              </svg>
            </button>
          </div>
        </div>
        <button type="button" id="btn-login" class="btn-primary">Entrar</button>
      </div>

      <p class="auth-switch">
        Ainda não tem conta?
        <a href="cadastro.html" class="auth-link">Cadastrar</a>
      </p>

    </div>
  </main>

  <script src="login_script.js"></script>
</body>
</html>
