<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Adicionar Amigos</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="adicionar_style.css">
</head>
<body>

  <div id="menu-overlay" class="menu-overlay"></div>

  <!-- barra lateral -->
  <aside id="global-menu" class="global-menu" aria-label="Menu global">
    <button id="close-menu" class="close-btn" type="button" aria-label="Fechar menu">&times;</button>

    <div class="menu-user">
      <img id="menu-avatar" src="" alt="Avatar do usuário" class="menu-avatar-img">
      <span id="menu-username" class="menu-username">Carregando...</span>
      <span id="menu-bio" class="menu-bio"></span>
    </div>

    <nav class="menu-options">
      <a href="amigos.html" class="menu-link">Chat</a>
      <a href="#" class="menu-link">Menu Inicial</a>
      <a href="#" class="menu-link">Fórum</a>
    </nav>

    <footer class="menu-footer">
      <button id="btn-denuncias" class="btn-denuncias" type="button">Denúncias</button>
    </footer>
  </aside>

  <div id="app">

    <header id="topbar">
      <button id="open-menu" class="hamburger" type="button" aria-label="Abrir menu">
        <span></span>
        <span></span>
        <span></span>
      </button>

      <div id="current-user-info" class="topbar-user">
        <img id="topbar-avatar" src="" alt="Avatar do usuário atual" class="topbar-avatar">
        <span id="topbar-username" class="topbar-username">Carregando...</span>
        <span class="status-dot online" aria-label="Online"></span>
      </div>
    </header>

    <div id="content-wrapper">

      <!-- lista de amigos -->
      <aside id="friends-panel">
        <div class="panel-header">
          <h1 class="panel-title">Amigos</h1>
          <a href="amigos.html" class="btn-voltar">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true">
              <path d="M19 12H5"/><path d="m12 19-7-7 7-7"/>
            </svg>
            Voltar
          </a>
        </div>

        <div class="search-wrap">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <circle cx="11" cy="11" r="8"></circle>
            <path d="m21 21-4.35-4.35"></path>
          </svg>
          <input type="text" id="search-input" class="search-input" placeholder="Coloque o id ou nome" autocomplete="off">
        </div>

        <p id="friends-status" class="status-message" aria-live="polite"></p>
        <div id="friends-list" class="friends-list-wrap"></div>
      </aside>

      <!-- recomendações -->
      <main id="recommendations">
        <h2 class="rec-title">recomendaçao de amigos:</h2>
        <p id="app-feedback" class="feedback" role="status" aria-live="polite"></p>
        <div id="rec-list" class="rec-list"></div>
      </main>

    </div>
  </div>

  <script src="../assets/js/sidebar-nav.js"></script>
  <script src="adicionar_script.js"></script>
</body>
</html>
