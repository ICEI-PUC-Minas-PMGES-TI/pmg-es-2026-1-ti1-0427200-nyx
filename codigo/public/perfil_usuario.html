<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Valkyria - Perfil de Usurio</title>
    <link rel="icon" href="./assets/images/logo.png">
    <link rel="stylesheet" href="assets/css/chat.css">
    <link rel="stylesheet" href="assets/css/perfil_usuario.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body>
    <div class="app-container">
        <aside class="sidebar">
            <div class="sidebar-top-actions">
                <button id="open-menu" class="open-menu-btn">☰</button>
            </div>
            <div class="sidebar-header">
            </div>
            <div class="sidebar-user-panel">
                <div class="user-info">
                    <div class="avatar-container">
                        <img src="assets/images/placeholder-avatar.png" alt="Avatar" class="my-avatar" onerror="this.src='https://api.dicebear.com/7.x/bottts-neutral/svg?seed=Nyx'">
                    </div>
                    <div class="user-text">
                        <span class="user-name">Usuário</span>
                    </div>
                </div>
            </div>
        </aside>
        <main class="main-content w-100">
            <header class="content-header d-flex align-items-center justify-content-center position-relative">
                <h1 class="m-0"><strong> Valkyria </strong></h1>
            </header>
            <div class="banner-container position-relative">
                <div id="perfil-banner" class="banner-bg"></div>
            </div>
            <div class=" user-info-section d-flex">
                <div class="avatar-wrapper ">
                    <img id="perfil-avatar" src="" alt="Avatar" class="avatar-img" style="display: none;">
                    <div id="avatar-placeholder" class="avatar-placeholder-view">
                        <i class="fa-solid fa-user text-white fs-3"></i>
                    </div>
                </div>
                <div class="d-flex dados">
                    <div>
                        <h2 id="perfil-nome" class="letra_cor_rosa m-0 fw-bold">......</h2>
                        <p id="perfil-id" class="letra_cor_rosa fs-6">id: ......</p>
                    </div>
                    <a href="edicao_perfil.html" id="btn-editar-perfil" class="letra_cor_rosa boda_rosa btn-edit-profile text-decoration-none" style="display: none;">
                        <i class="letra_cor_rosa fa-solid fa-pen-to-square me-2 "></i>Editar Perfil
                    </a>
                </div>
            </div>
            <div class="container-fluid ">
                <div class="row mt-4 g-4">
                    <div class="col-12 col-md-6">
                        <div class="rounded-4 boda_rosa bg_escuro p-4 cards">
                            <h4 class="card-title-purple letra_cor_rosa mb-3">Bio:</h4>
                            <p id="perfil-bio" class="text-white-50 m-0 fs-5">Nenhuma biografia informada ainda.</p>
                        </div>
                    </div>
                    <div class="col-12 col-md-6">
                        <div class="rounded-4 boda_rosa bg_escuro p-4 cards">
                            <h4 class="card-title-purple letra_cor_rosa mb-3">Interesses:</h4>
                            <div id="perfil-jogos" class="d-flex flex-wrap gap-2">
                                <span class="text-white-50 text-muted">Nenhum jogo selecionado.</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>
    <script src="assets/js/sidebar-nav.js"></script>
    <script src="assets/js/perfil_usuario.js"></script>
</body>

</html>
