<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fórum</title>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../../assets/css/chat.css">
    <link rel="stylesheet" href="../../assets/css/search.css">
    <link rel="stylesheet" href="forum.css">
</head>
<body>

    <div id="global-menu" class="global-menu">
        <button id="close-menu" class="close-btn">&times;</button>
        <nav class="menu-options">
            <a href="../../private_message.html" class="menu-link">Chat</a>
            <a href="../../index.html" class="menu-link">Menu Inicial</a>
            <a href="../../modulos/tela-forum/forum.html" class="menu-link active">Fórum</a>
            <a href="../../community_search.html" class="menu-link">Comunidades</a>
            <a href="../../posts.html" class="menu-link">Posts</a>
            <a href="../../pagina_amigos/amigos.html" class="menu-link">Amigos</a>
            <a href="../../perfil_usuario.html" class="menu-link">Perfil</a>
            <a href="../../Configuraçoes/my_account.html" class="menu-link">Configurações</a>
        </nav>
    </div>

    <div id="menu-overlay" class="menu-overlay"></div>

    <div class="app-container">
        <aside class="sidebar">
            <div class="sidebar-top-actions">
                <button id="open-menu" class="open-menu-btn">☰</button>
            </div>
            <div class="sidebar-header">
                <h3>Nyx</h3>
                <p>Seu espaço</p>
            </div>
            <div class="sidebar-user-panel">
                <div class="user-info">
                    <div class="avatar-container">
                        <img src="../../assets/images/placeholder-avatar.png" alt="Avatar" class="my-avatar" onerror="this.src='https://api.dicebear.com/7.x/bottts-neutral/svg?seed=Visitante'">
                    </div>
                    <div class="user-text">
                        <span class="user-name">Visitante</span>
                    </div>
                </div>
            </div>
        </aside>

        <div id="content-wrapper">
            <main class="conteudo-principal">
                <div class="search-container">
                    <input type="text" id="barra-pesquisa" class="search-input" placeholder="Pesquisar no fórum...">
                    <button id="toggle-tags-btn" class="toggle-tags-btn" title="Filtrar">+</button>
                </div>

                <div class="header-forum">
                    <h2 class="panel-title">Fórum</h2>
                    <button id="btn-novo-topico" class="btn-voltar">+ Novo Tópico</button>
                </div>
                
                <section class="secao-forum">
                    <h2 class="titulo-secao">Principais Notícias:</h2>
                    <div class="grid-noticias" id="container-noticias"></div>
                </section>

                <section class="secao-forum mt-30">
                    <h2 class="titulo-secao">Discussões:</h2>
                    <div class="grid-discussoes" id="container-discussoes"></div>
                </section>
            </main>
        </div>
    </div>

    <div id="modal-novo-topico" class="menu-overlay">
        <div class="modal-conteudo">
            <h2 class="panel-title mb-20">Criar Discussão</h2>
            <form id="form-novo-topico">
                <textarea id="texto-topico" class="search-input" rows="4" placeholder="Sobre o que quer falar?" required></textarea>
                <div class="modal-botoes mt-20">
                    <button type="button" id="fechar-modal-topico" class="btn-voltar">Cancelar</button>
                    <button type="submit" class="btn-voltar" style="background: var(--accent); color: white;">Publicar</button>
                </div>
            </form>
        </div>
    </div>

    <div id="modal-login" class="menu-overlay">
        <div class="modal-conteudo" style="position: relative;">
            <button id="fechar-modal-login" style="position: absolute; top: 10px; right: 15px; background: none; border: none; color: var(--text-muted); font-size: 24px; cursor: pointer;">&times;</button>
            <div class="modal-icone" style="font-size: 40px; margin-bottom: 15px;">🔒</div>
            <h2 class="mb-20">Acesso Restrito</h2>
            <p>Para fazer isso, você precisa estar logado na sua conta.</p>
            <div class="modal-botoes mt-20" style="display: flex; gap: 10px; justify-content: center; margin-top: 25px;">
                <a href="../../login/cadastro.html" class="btn-voltar" style="text-decoration: none;">Cadastrar-se</a>
                <a href="../../login/login.html" class="btn-voltar" style="background: var(--accent); color: white; text-decoration: none;">Fazer Login</a>
            </div>
        </div>
    </div>
    
    <script src="../../assets/js/sidebar-nav.js"></script>
    <script src="forum.js"></script>
</body>
</html>
