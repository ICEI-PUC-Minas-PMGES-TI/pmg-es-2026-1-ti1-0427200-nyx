<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Amigos</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="menu-overlay" class="menu-overlay"></div>

  <aside id="global-menu" class="global-menu" aria-label="Menu global">
    <button id="close-menu" class="close-btn" type="button" aria-label="Fechar menu">&times;</button>

    <div class="menu-user">
      <img id="menu-avatar" src="" alt="Avatar do usuário" class="menu-avatar-img">
      <span id="menu-username" class="menu-username">Carregando...</span>
      <span id="menu-bio" class="menu-bio"></span>
    </div>

    <nav class="menu-options">
      <a href="#" class="menu-link active">Chat</a>
      <a href="#" class="menu-link">Menu Inicial</a>
      <a href="#" class="menu-link">Fórum</a>
    </nav>

    <footer class="menu-footer">
      <button id="btn-denuncias" class="btn-denuncias" type="button">Denúncias</button>
    </footer>
  </aside>

  <div id="app">
    <header id="topbar">
      <button id="open-menu" class="hamburger" type="button" aria-label="Abrir menu">
        <span></span>
        <span></span>
        <span></span>
      </button>

      <div id="current-user-info" class="topbar-user">
        <img id="topbar-avatar" src="" alt="Avatar do usuário atual" class="topbar-avatar">
        <span id="topbar-username" class="topbar-username">Carregando...</span>
        <span class="status-dot online" aria-label="Online"></span>
      </div>
    </header>

    <div id="content-wrapper">
      <aside id="friends-panel">
        <div class="panel-header">
          <div>
            <p class="eyebrow">API REST com JSON Server</p>
            <h1 class="panel-title">Amigos</h1>
          </div>
        </div>

        <div class="search-wrap">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <circle cx="11" cy="11" r="8"></circle>
            <path d="m21 21-4.35-4.35"></path>
          </svg>
          <input type="text" id="search-input" class="search-input" placeholder="Buscar amigo..." autocomplete="off">
        </div>

        <p id="friends-status" class="status-message" aria-live="polite"></p>
        <div id="friends-grid" class="friends-grid-wrap"></div>
      </aside>

      <main id="feed">
        <div class="feed-heading">
          <div>
            <p class="eyebrow">Dados carregados de /posts e /users</p>
            <h2 class="feed-title">Posts dos seus amigos</h2>
          </div>
          <button id="btn-refresh" class="btn-secondary" type="button">Atualizar</button>
        </div>

        <p id="app-feedback" class="feedback" role="status" aria-live="polite"></p>
        <div id="posts-list" class="posts-list"></div>
      </main>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
