<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Minha Conta</title>
<link rel="stylesheet" href="account.css">
</head>

<body>
<div class="container">

    <h1 class="titulo">Minha Conta</h1>

</head>

<!-- OVERLAY -->
<div id="menu-overlay" class="menu-overlay"></div>

<!-- BOTÃO MENU -->
<button id="open-menu">☰</button>

<!-- MENU GLOBAL -->
<div id="global-menu" class="global-menu">

    <button id="close-menu" class="close-btn">
    
    </button>

    <nav class="menu-options">

        <a href="#" class="menu-link active">
            Chat
        </a>

        <a href="#" class="menu-link">
            Menu Inicial
        </a>

        <a href="#" class="menu-link">
            Fórum
        </a>

    </nav>
</div>

<!-- CONTEÚDO -->
<main class="content">

    <div class="config-box">

        <div class="logo">
            LOGO
        </div>

        <button class="config-btn" id="btn-seguranca">
            Segurança
        </button>

        <button class="config-btn" id="btn-privacidade">
            Privacidade da Conta
        </button>

        <button class="config-btn" id="btn-notificacao">
            Notificações
        </button>

        <button class="config-btn" id="btn-conta">
            Conta
        </button>

    </div>
    <div id="perfil"></div>
</main>
<div id="popup-seguranca" class="popup">

    <div class="popup-content">

        <h2>Configurações de Segurança</h2>

        <button class="popup-option">
            Alterar Senha
        </button>

        <button class="popup-option">
            Verificação em 2 Etapas
        </button>

       <button class="popup-option" id="btn-dispositivos">
            Dispositivos Conectados
        </button>
        

        <button class="popup-option">
            Histórico de Login
        </button>

        <button id="fechar-popup" class="fechar-popup">
            Fechar
        </button>

    </div>

</div>
<!-- POPUP DISPOSITIVOS -->
<div id="popup-dispositivos" class="popup">

    <div class="popup-content">

        <h2>Dispositivos Conectados</h2>

        <div id="lista-dispositivos"></div>

        <button id="fechar-dispositivos">

            Fechar

        </button>

    </div>

</div>
<script src="configuracoes.js"></script>
</body>
</html>
