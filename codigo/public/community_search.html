<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Valkyria - Busca de Comunidades</title>
    <link rel="stylesheet" href="assets/css/chat.css">
    <link rel="stylesheet" href="assets/css/search.css">
    <link rel="icon" href="assets/images/logo2.png">
</head>
<body>
    <div class="app-container">
        <aside class="sidebar">
            <div class="sidebar-top-actions">
                <button id="open-menu" class="open-menu-btn">☰</button>
            </div>
            <div class="sidebar-header">
                <h3>Nyx</h3>
                <p>Comunidades e navegação</p>
            </div>
            <div class="sidebar-user-panel">
                <div class="user-info">
                    <div class="avatar-container">
                        <img src="assets/images/placeholder-avatar.png" alt="Avatar" class="my-avatar" onerror="this.src='https://api.dicebear.com/7.x/bottts-neutral/svg?seed=Nyx'">
                    </div>
                    <div class="user-text">
                        <span class="user-name">Usuário</span>
                    </div>
                </div>
            </div>
        </aside>
        <main class="main-content">
            <section class="main-page">
                <header class="search-header">
                    <h2>Pesquisar Comunidades</h2>
                </header>
                <div class="search-container">
                    <input type="text" id="search-input" placeholder="Digite o nome da comunidade..." class="search-input">
                    <button id="toggle-tags-btn" class="toggle-tags-btn" title="Filtrar por tags">+</button>
                </div>
                <div id="tags-panel" class="tags-panel hidden"></div>
                <section id="search-results" class="search-results"></section>
            </section>
        </main>
    </div>
    <script src="assets/js/sidebar-nav.js"></script>
    <script src="assets/js/communities_script.js"></script>
</body>
</html>
